name: CI

# Se ejecuta en cada push y en cada Pull Request.
# (Este repo no tiene rama main: hay una rama por taller, así que el PR no se filtra por rama destino.)
on:
  push:
  pull_request:

jobs:
  test:
    name: Pruebas de ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [eureka-server, gateway, investigadores-service, publicaciones-service, consultas-service]
    defaults:
      run:
        # En este repo los servicios viven dentro de rica-microservicios/
        working-directory: rica-microservicios/${{ matrix.servicio }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: rica-microservicios/${{ matrix.servicio }}/pom.xml

      # Se excluyen las pruebas de arranque completo (*ApplicationTests): necesitan
      # Kafka, PostgreSQL o MongoDB corriendo. Las pruebas unitarias sí se ejecutan.
      - name: Ejecutar pruebas
        run: sh ./mvnw -B -ntp test -Dtest='!*ApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false
