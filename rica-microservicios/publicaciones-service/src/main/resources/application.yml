server:
  port: 8081

spring:
  application:
    name: publicaciones-service
  grpc:
    client:
      channel:
        investigadores:
          target: static://localhost:9090
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: publicaciones-service
      auto-offset-reset: earliest
  # En Spring Boot 4 es spring.mongodb.uri (spring.data.mongodb.uri ya no se aplica)
  mongodb:
    uri: mongodb://localhost:27017/rica

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
