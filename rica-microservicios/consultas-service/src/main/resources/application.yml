server:
  port: 8083

spring:
  application:
    name: consultas-service
  # Base propia del lado de lectura: nada que ver con la base "rica" de publicaciones-service.
  # En Spring Boot 4 es spring.mongodb.uri (spring.data.mongodb.uri ya no se aplica).
  mongodb:
    uri: mongodb://localhost:27017/rica_consultas

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: consultas-service-v2
      auto-offset-reset: earliest

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
